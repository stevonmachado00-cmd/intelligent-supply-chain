version: "3.9"

services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: scct_postgres
    environment:
      POSTGRES_DB: supply_chain_db
      POSTGRES_USER: scct_user
      POSTGRES_PASSWORD: scct_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scct_user -d supply_chain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: scct_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # MLflow Tracking Server
  # ============================================================
  mlflow:
    image: python:3.11-slim
    container_name: scct_mlflow
    command: >
      bash -c "pip install mlflow==2.17.2 psycopg2-binary boto3 &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri postgresql://scct_user:scct_pass@postgres:5432/mlflow_db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000

  # ============================================================
  # FastAPI Backend
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: scct_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../mlflow/model_artifacts:/app/mlflow/model_artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # Modern React + Vite Frontend (Nginx)
  # ============================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: scct_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ============================================================
  # Streamlit Dashboard (Legacy fallback)
  # ============================================================
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: scct_dashboard
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:
