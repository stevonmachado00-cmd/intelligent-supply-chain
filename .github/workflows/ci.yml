name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supply_chain_test_db
          POSTGRES_USER: scct_user
          POSTGRES_PASSWORD: scct_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ api/ tests/

      - name: Format check with black
        run: black --check src/ api/ tests/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://scct_user:scct_pass@localhost:5432/supply_chain_test_db
          REDIS_URL: redis://localhost:6379/0
          API_SECRET_KEY: test-secret-key
        run: pytest tests/ -v
